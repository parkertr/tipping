rules:
  main:
    files: ["$all"]
    allow:
      - "github.com/parkertr/tipping/internal/*"
      - "github.com/parkertr/tipping/pkg/*"
      - "github.com/gorilla/mux"
      - "github.com/lib/pq"
      - "github.com/golang-jwt/jwt/v5"
